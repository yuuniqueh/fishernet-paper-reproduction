# Strong-backbone trial: train only; use val for model selection.
# Frozen backbone initially; set freeze_backbone: false in a NEW experiment for fine-tuning.
seed: 42
loss_reduction: valid_mean
lr_descriptor_projection: 0.0001
fisher_lr_milestones:
- 3000
- 4000
fisher_lr_gamma: 0.1
device: cuda
dataset_root: ../04_dataset/VOC/VOCdevkit
dataset: voc2007
backbone: resnet50
model_variant: dense
pretrained_backbone: true
num_classes: 20
descriptor_dim: 256
num_components: 32
batch_size: 2
fisher_micro_batch_size: 1
fisher_gradient_accumulation_steps: 2
evaluation_batch_size: 1
whole_image_batch_size: 16
num_workers: 0
whole_image_steps: 1500
whole_image_lr_new: 0.01
whole_image_lr_backbone: 1.0e-05
whole_image_lr_step: 500
whole_image_save_every: 500
fisher_steps: 5000
fisher_save_every: 500
lr_fisher: 0.001
lr_classifier: 0.001
lr_backbone: 1.0e-05
momentum: 0.9
weight_decay: 0.0005
patch_scales:
- 64
- 96
- 128
- 160
- 192
- 224
- 256
patch_step: 32
max_patches: null
image_scales:
- 224
- 336
svm_C: 1.0
gmm_max_images: 1000
gmm_max_descriptors: 50000
gmm_max_iter: 300
train_split: train
freeze_backbone: true
gmm_sampling_mode: uniform_per_image
backbone_cache_dir: .model-cache
